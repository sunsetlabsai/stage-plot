name: CI

on:
  # `edited` matters: a PR retargeted onto main (common when unstacking a chunk)
  # fires only `edited`, which is NOT in the default type set — without it a
  # retargeted PR reports no CI run at all and its checks panel still looks green.
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
